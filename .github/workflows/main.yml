name: CI Node.js Project
on:
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main 
      
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 16

      - name: Install dependencies
        run: npm ci

      - name: Run the test
        run: npm test

      - name: Build the application
        run: npm run build
